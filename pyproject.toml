[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faar"
version = "0.1.0"
description = "Phase 1 prototype for Failure-Aware Agentic Recovery for OCR-RAG"
readme = "docs/faar_execution_plan.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic==0.49.0",
  "faiss-cpu==1.9.0.post1",
  "kaleido==0.2.1",
  "langchain-core==0.3.49",
  "langgraph==0.3.18",
  "numpy==1.26.4",
  "openai==1.68.2",
  "pandas==2.2.3",
  "plotly==6.0.1",
  "pydantic==2.10.6",
  "python-dotenv==1.0.1",
  "ragas==0.2.15",
  "rank-bm25==0.2.2",
  "einops==0.8.1",
  "sentence-transformers==3.4.1",
  "symspellpy==6.9.0",
  "transformers==4.51.3",
  "typer==0.12.5",
  "wandb==0.17.9",
]

[project.optional-dependencies]
aaai = [
  "accelerate==1.5.2",
  "colpali-engine==0.3.10",
  "docling==1.20.0",
  "label-studio==1.17.0",
  "pillow==10.4.0",
  "pytest==8.3.5",
  "torch==2.6.0",
  "torchvision==0.21.0",
]

[project.scripts]
faar-demo = "faar.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
